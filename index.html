<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retro TV 3D Experience</title>
    <!-- Google Fonts for selection -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=DotGothic16&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Three.js, OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(18, 22, 33, 0.95);
            --panel-border: rgba(255, 255, 255, 0.15);
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #webgl-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            color: var(--text-main);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 320px;
            overflow: hidden;
            transition: max-height 0.25s ease-out;
            max-height: 90vh;
        }

        .ui-panel.collapsed {
            max-height: 52px;
        }

        .panel-header {
            background: rgba(30, 35, 45, 0.9);
            padding: 12px 16px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            height: 52px;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #60a5fa;
        }

        .toggle-collapse-btn {
            background: #374151;
            color: #fff;
            border: none;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .panel-content {
            padding: 16px;
            max-height: calc(90vh - 52px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-dim);
        }

        input[type="text"], select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        select option {
            background: #1e293b;
            color: white;
        }

        .bottom-control-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 15px;
            background: rgba(18, 22, 33, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .action-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 20px;
            padding: 10px 22px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: transform 0.1s ease;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn.off {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        /* CRT Screen Power Animation Overlay */
        #power-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        @keyframes powerOnFlash {
            0% { transform: scale(1, 0.002); background: white; opacity: 1; }
            50% { transform: scale(1.05, 1.05); background: white; opacity: 0.8; }
            100% { transform: scale(1, 1); background: transparent; opacity: 0; }
        }

        @keyframes powerOffShrink {
            0% { transform: scale(1, 1); background: transparent; opacity: 1; }
            40% { transform: scale(1, 0.005); background: white; opacity: 1; }
            100% { transform: scale(0.001, 0.0001); background: black; opacity: 1; }
        }

        .power-on-anim {
            animation: powerOnFlash 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .power-off-anim {
            animation: powerOffShrink 0.5s cubic-bezier(0.5, 0, 1, 1) forwards;
        }

        #crtTextureCanvas {
            display: none;
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <div id="power-overlay"></div>
    <canvas id="crtTextureCanvas" width="1024" height="768"></canvas>

    <!-- Settings Panel (Position calibration hidden) -->
    <div class="ui-panel" id="movable-panel">
        <div class="panel-header" id="panel-drag-handle">
            <span class="panel-title">📺 復古電視設定選單</span>
            <button class="toggle-collapse-btn" id="btn-collapse">收合 [-]</button>
        </div>
        
        <div class="panel-content">
            <div class="control-group">
                <label for="messageInput">跑馬燈播放文字</label>
                <input type="text" id="messageInput" value="★ 歡迎來到復古電視 3D 模擬世界！Enjoy the retro vibe! ★">
            </div>

            <div class="control-group">
                <label for="fontSelect">選擇字型</label>
                <select id="fontSelect">
                    <option value="'Noto Sans TC', sans-serif">黑體 (Noto Sans TC)</option>
                    <option value="'DotGothic16', sans-serif">像素字型 (DotGothic16)</option>
                    <option value="'Orbitron', sans-serif">科技感字型 (Orbitron)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="fontSizeSelect">字體大小</label>
                <select id="fontSizeSelect">
                    <option value="36">小 (36px)</option>
                    <option value="52" selected>中 (52px)</option>
                    <option value="72">大 (72px)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="speedSelect">跑馬燈速度</label>
                <select id="speedSelect">
                    <option value="1">慢速</option>
                    <option value="2.5" selected>標準</option>
                    <option value="5">快速</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Bottom Permanent Power Control Bar -->
    <div class="bottom-control-bar">
        <button class="action-btn" id="confirmBtn">▶ 開機</button>
        <button class="action-btn off" id="powerOffBtn">電源關閉</button>
    </div>

    <script>
        // Panel collapse logic
        const collapseBtn = document.getElementById('btn-collapse');
        const panel = document.getElementById('movable-panel');
        collapseBtn.addEventListener('click', () => {
            panel.classList.toggle('collapsed');
            collapseBtn.innerText = panel.classList.contains('collapsed') ? "展開 [+]" : "收合 [-]";
        });

        // Panel draggable handling
        const handle = document.getElementById('panel-drag-handle');
        let isDraggingPanel = false, startX, startY, initialLeft, initialTop;
        handle.addEventListener('mousedown', dragStart);
        handle.addEventListener('touchstart', dragStart, { passive: false });

        function dragStart(e) {
            if (e.target === collapseBtn) return;
            isDraggingPanel = true;
            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            startX = clientX; startY = clientY;
            const rect = panel.getBoundingClientRect();
            initialLeft = rect.left; initialTop = rect.top;
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('touchend', dragEnd);
        }
        function dragMove(e) {
            if (!isDraggingPanel) return;
            if (e.cancelable) e.preventDefault();
            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            panel.style.left = Math.max(0, Math.min(initialLeft + (clientX - startX), window.innerWidth - panel.offsetWidth)) + 'px';
            panel.style.top = Math.max(0, Math.min(initialTop + (clientY - startY), window.innerHeight - panel.offsetHeight)) + 'px';
        }
        function dragEnd() {
            isDraggingPanel = false;
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('touchend', dragEnd);
        }

        // Web Audio API for TV Static Noise Sound Effect
        let audioCtx = null;
        let noiseNode = null;
        let noiseGain = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startNoiseSound() {
            initAudio();
            if (noiseNode) return;

            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1200;
            filter.Q.value = 0.8;

            noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.15, audioCtx.currentTime);

            noiseNode.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            noiseNode.start();
        }

        function stopNoiseSound() {
            if (noiseNode) {
                try {
                    noiseNode.stop();
                    noiseNode.disconnect();
                } catch(e) {}
                noiseNode = null;
            }
        }

        // Three.js setup
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const textCanvas = document.getElementById('crtTextureCanvas');
        const ctx = textCanvas.getContext('2d');
        const crtTexture = new THREE.CanvasTexture(textCanvas);

        let tvState = 'noise'; // 'noise' or 'running' or 'off'
        let textXPos = textCanvas.width;

        function updateCRTTexture() {
            const w = textCanvas.width;
            const h = textCanvas.height;
            ctx.clearRect(0, 0, w, h);

            if (tvState === 'off') {
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, w, h);
                crtTexture.needsUpdate = true;
                return;
            }

            ctx.fillStyle = '#111827';
            ctx.fillRect(0, 0, w, h);

            if (tvState === 'noise') {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                const intensity = 220;
                for (let i = 0; i < data.length; i += 4) {
                    if (Math.random() < 0.4) {
                        const val = Math.random() * intensity;
                        data[i] = Math.min(255, data[i] + val);
                        data[i+1] = Math.min(255, data[i+1] + val);
                        data[i+2] = Math.min(255, data[i+2] + val);
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            }

            if (tvState === 'running' || tvState === 'noise') {
                const text = document.getElementById('messageInput').value;
                const fontFamily = document.getElementById('fontSelect').value;
                const fontSize = document.getElementById('fontSizeSelect').value;
                const speed = parseFloat(document.getElementById('speedSelect').value);

                ctx.font = `bold ${fontSize}px ${fontFamily}`;
                ctx.textBaseline = 'middle';
                ctx.fillStyle = tvState === 'noise' ? 'rgba(203, 213, 225, 0.4)' : '#34d399';
                
                ctx.fillText(text, textXPos, h / 2);

                textXPos -= speed * 2;
                const textWidth = ctx.measureText(text).width;
                if (textXPos < -textWidth) {
                    textXPos = w;
                }
            }

            crtTexture.needsUpdate = true;
        }

        let tvMesh = null;
        let screenMesh = null;

        // Apply final confirmed locked values
        const screenGeo = new THREE.PlaneGeometry(0.78, 0.58);
        const screenMat = new THREE.MeshBasicMaterial({ map: crtTexture, side: THREE.DoubleSide });
        screenMesh = new THREE.Mesh(screenGeo, screenMat);
        screenMesh.position.set(0.481, -0.260, 0.444);
        screenMesh.rotation.set(0.007, 0.012, -0.000);
        screenMesh.scale.set(1.906, 2.036, 0.531);
        scene.add(screenMesh);

        const loader = new THREE.GLTFLoader();
        loader.load('tv__old_tv__retro_tv.glb', function (gltf) {
            tvMesh = gltf.scene;
            const box = new THREE.Box3().setFromObject(tvMesh);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            tvMesh.position.sub(center);
            tvMesh.scale.multiplyScalar(1.8 / Math.max(size.x, size.y, size.z));
            tvMesh.rotation.y = -Math.PI / 2;
            scene.add(tvMesh);
        });

        const overlay = document.getElementById('power-overlay');

        function triggerPowerEffect(isTurningOn) {
            overlay.className = '';
            void overlay.offsetWidth;
            overlay.className = isTurningOn ? 'power-on-anim' : 'power-off-anim';
        }

        document.getElementById('confirmBtn').addEventListener('click', () => {
            initAudio();
            triggerPowerEffect(true);
            tvState = 'running';
            stopNoiseSound();
        });

        document.getElementById('powerOffBtn').addEventListener('click', () => {
            triggerPowerEffect(false);
            tvState = 'off';
            stopNoiseSound();
        });

        window.addEventListener('pointerdown', () => {
            if (tvState === 'noise') {
                startNoiseSound();
            }
        }, { once: true });

        startNoiseSound();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateCRTTexture();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
