<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro TV 3D Interactive Configuration & CRT Effects</title>
    <!-- Google Chinese Font: Noto Sans TC & DotGothic16 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
    
    <!-- Three.js and OrbitControls for GLB model loading & touch/mouse manipulation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(18, 22, 33, 0.88);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #webgl-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            width: 100%;
        }

        @media (max-width: 850px) {
            .ui-layer {
                left: 16px;
                top: 16px;
                right: 16px;
                max-width: none;
            }
        }

        .interactive {
            pointer-events: auto;
        }

        /* Toggle Button */
        .toggle-panel-btn {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: background 0.2s;
        }

        .toggle-panel-btn:hover {
            background: rgba(28, 34, 48, 0.95);
        }

        /* Control Panel */
        .config-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: translateY(0);
        }

        .config-panel.collapsed {
            opacity: 0;
            transform: translateY(-10px);
            max-height: 0;
            padding: 0 24px;
            overflow: hidden;
            border: none;
            box-shadow: none;
            margin: 0;
        }

        .config-panel h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }

        .control-group label span {
            color: var(--accent);
            font-size: 0.8rem;
        }

        input[type="text"] {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        .radio-row {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            cursor: pointer;
            color: var(--text-dim);
        }

        .radio-label input {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
        }

        .action-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
            text-align: center;
        }

        .action-btn.off {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .action-btn:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        /* Hidden 2D CRT Screen Rendering Canvas */
        #crtTextureCanvas {
            display: none;
        }

        /* Instructions HUD */
        .hud-instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem;
            color: var(--text-dim);
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <canvas id="crtTextureCanvas" width="1024" height="768"></canvas>

    <div class="ui-layer">
        <!-- Toggle Button to collapse/expand panel -->
        <button class="toggle-panel-btn interactive" id="togglePanelBtn">
            <span>⚙️ 設定面板</span>
            <span id="toggleIcon">▲ 隱藏</span>
        </button>

        <!-- Configuration Control Panel -->
        <div class="config-panel interactive" id="configPanel">
            <h2>電視訊息與畫面設定</h2>
            
            <div class="control-group">
                <label for="messageInput">顯示文字 (支援多行)</label>
                <input type="text" id="messageInput" value="正在顯示：復古電視 3D 模型">
            </div>

            <div class="control-group">
                <label for="textSizeRange">文字大小 <span id="textSizeVal">大</span></label>
                <input type="range" id="textSizeRange" min="1" max="3" value="2" step="1">
            </div>

            <div class="control-group">
                <label for="scrollSpeedRange">捲動速度 <span id="scrollSpeedVal">中等</span></label>
                <input type="range" id="scrollSpeedRange" min="0" max="3" value="2" step="1">
            </div>

            <div class="control-group">
                <label for="fontSelect">Google 中文字型</label>
                <select id="fontSelect">
                    <option value="Noto Sans TC" selected>思源黑體 (Noto Sans TC)</option>
                    <option value="DotGothic16">像素點陣體 (DotGothic16)</option>
                    <option value="monospace">終端機等寬字 (Monospace)</option>
                </select>
            </div>

            <div class="control-group">
                <label>文字顏色</label>
                <div class="radio-row">
                    <label class="radio-label">
                        <input type="radio" name="textColor" value="grayscale" checked> 經典灰白
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="textColor" value="white"> 純白發光
                    </label>
                </div>
            </div>

            <div class="btn-row">
                <button class="action-btn" id="confirmBtn">確認開機/重整</button>
                <button class="action-btn off" id="powerOffBtn">關機效果</button>
            </div>
        </div>
    </div>

    <div class="hud-instructions">
        💡 提示：可直接用滑鼠或手指拖曳旋轉 3D 電視，滾輪或雙指縮放。
    </div>

    <script>
        // --- Panel Toggle Feature ---
        const togglePanelBtn = document.getElementById('togglePanelBtn');
        const configPanel = document.getElementById('configPanel');
        const toggleIcon = document.getElementById('toggleIcon');
        let isPanelOpen = true;

        togglePanelBtn.addEventListener('click', () => {
            isPanelOpen = !isPanelOpen;
            if (isPanelOpen) {
                configPanel.classList.remove('collapsed');
                toggleIcon.textContent = '▲ 隱藏';
            } else {
                configPanel.classList.add('collapsed');
                toggleIcon.textContent = '▼ 展開';
            }
        });

        // --- Three.js Setup & GLB Loading ---
        const container = document.getElementById('webgl-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1.0;
        controls.maxDistance = 10.0;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x3b82f6, 1, 10);
        pointLight.position.set(0, 0, 2);
        scene.add(pointLight);

        // --- Dynamic 2D CRT Screen Texture Generation ---
        const textCanvas = document.getElementById('crtTextureCanvas');
        const ctx = textCanvas.getContext('2d');
        const crtTexture = new THREE.CanvasTexture(textCanvas);
        crtTexture.generateMipmaps = true;
        crtTexture.minFilter = THREE.LinearFilter;
        crtTexture.magFilter = THREE.LinearFilter;

        // UI Inputs
        const messageInput = document.getElementById('messageInput');
        const textSizeRange = document.getElementById('textSizeRange');
        const textSizeVal = document.getElementById('textSizeVal');
        const scrollSpeedRange = document.getElementById('scrollSpeedRange');
        const scrollSpeedVal = document.getElementById('scrollSpeedVal');
        const fontSelect = document.getElementById('fontSelect');
        const confirmBtn = document.getElementById('confirmBtn');
        const powerOffBtn = document.getElementById('powerOffBtn');

        const sizeLabels = { '1': '小', '2': '大', '3': '特大' };
        const speedLabels = { '0': '靜止', '1': '慢速', '2': '中等', '3': '快速' };

        textSizeRange.addEventListener('input', (e) => textSizeVal.textContent = sizeLabels[e.target.value]);
        scrollSpeedRange.addEventListener('input', (e) => scrollSpeedVal.textContent = speedLabels[e.target.value]);

        let tvState = 'noise';
        let textX = textCanvas.width;
        let noiseIntensity = 1.0;
        let powerOffProgress = 0;

        let config = {
            text: messageInput.value,
            size: parseInt(textSizeRange.value),
            speed: parseInt(scrollSpeedRange.value),
            fontFamily: fontSelect.value,
            textColor: document.querySelector('input[name="textColor"]:checked').value
        };

        function updateCRTTexture() {
            const w = textCanvas.width;
            const h = textCanvas.height;
            ctx.clearRect(0, 0, w, h);

            const bgGrad = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, w * 0.7);
            if (tvState === 'off') {
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, w, h);
                crtTexture.needsUpdate = true;
                return;
            }

            bgGrad.addColorStop(0, '#111827');
            bgGrad.addColorStop(1, '#030712');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            if (tvState === 'noise' || tvState === 'booting' || noiseIntensity > 0.05) {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                const intensity = (tvState === 'noise') ? 220 : (noiseIntensity * 100);
                for (let i = 0; i < data.length; i += 4) {
                    if (Math.random() < 0.4) {
                        const val = Math.random() * intensity;
                        data[i] = Math.min(255, data[i] + val);
                        data[i+1] = Math.min(255, data[i+1] + val);
                        data[i+2] = Math.min(255, data[i+2] + val);
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            }

            if (tvState === 'running' || tvState === 'booting') {
                let baseSize = 48;
                if (config.size === 1) baseSize = 32;
                if (config.size === 3) baseSize = 64;

                let fontName = config.fontFamily;
                if (fontName === 'DotGothic16') {
                    ctx.font = `bold ${baseSize}px 'DotGothic16', monospace`;
                } else if (fontName === 'monospace') {
                    ctx.font = `bold ${baseSize}px monospace`;
                } else {
                    ctx.font = `bold ${baseSize}px 'Noto Sans TC', sans-serif`;
                }

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                let fillColor = '#f3f4f6';
                let glowColor = 'rgba(243, 244, 246, 0.8)';
                if (config.textColor === 'grayscale') {
                    fillColor = '#cbd5e1';
                    glowColor = 'rgba(203, 213, 225, 0.5)';
                }

                ctx.shadowColor = glowColor;
                ctx.shadowBlur = 15;
                ctx.fillStyle = fillColor;

                const lines = config.text.split('\n');
                const lineHeight = baseSize * 1.5;
                const startY = h / 2 - ((lines.length - 1) * lineHeight) / 2;

                if (config.speed === 0) {
                    lines.forEach((line, index) => {
                        ctx.fillText(line, w / 2, startY + (index * lineHeight));
                    });
                } else {
                    lines.forEach((line, index) => {
                        ctx.fillText(line, textX, startY + (index * lineHeight));
                    });
                    let moveStep = config.speed * 3;
                    textX -= moveStep;
                    if (textX < -ctx.measureText(config.text).width - 200) {
                        textX = w + 200;
                    }
                }
            }

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            for (let y = 0; y < h; y += 4) {
                ctx.fillRect(0, y, w, 2);
            }

            if (tvState === 'powering_off') {
                const p = powerOffProgress;
                if (p < 0.8) {
                    const heightFactor = Math.max(2, (1 - p / 0.8) * h);
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillRect(0, 0, w, (h - heightFactor) / 2);
                    ctx.fillRect(0, (h + heightFactor) / 2, w, (h - heightFactor) / 2);
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 30;
                    ctx.fillRect(0, h / 2 - 2, w, 4);
                } else {
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, w, h);
                    const dotSize = Math.max(1, (1 - (p - 0.8) / 0.2) * 50);
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(w / 2, h / 2, dotSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            crtTexture.needsUpdate = true;
        }

        // --- Load GLB Model ---
        let tvMesh = null;
        const loader = new THREE.GLTFLoader();
        
        loader.load(
            'tv__old_tv__retro_tv.glb',
            function (gltf) {
                tvMesh = gltf.scene;
                const box = new THREE.Box3().setFromObject(tvMesh);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                tvMesh.position.sub(center);
                
                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = 1.8 / maxDim;
                tvMesh.scale.multiplyScalar(scaleFactor);

                scene.add(tvMesh);

                tvMesh.traverse((child) => {
                    if (child.isMesh) {
                        const matName = child.material && child.material.name ? child.material.name.toLowerCase() : '';
                        const meshName = child.name ? child.name.toLowerCase() : '';
                        if (meshName.includes('screen') || meshName.includes('display') || matName.includes('screen') || matName.includes('display')) {
                            child.material = new THREE.MeshBasicMaterial({ map: crtTexture });
                        }
                    }
                });

                setupScreenMaterial(tvMesh);
            },
            undefined,
            function (error) {
                console.warn('Could not load GLB, using fallback TV model.', error);
                createFallbackTV();
            }
        );

        function setupScreenMaterial(root) {
            let foundScreen = false;
            root.traverse((child) => {
                if (child.isMesh && child.material) {
                    if (!foundScreen) {
                        child.material = new THREE.MeshBasicMaterial({ map: crtTexture });
                        foundScreen = true;
                    }
                }
            });
        }

        function createFallbackTV() {
            const group = new THREE.Group();
            const cabinetGeo = new THREE.BoxGeometry(1.6, 1.2, 1.2);
            const cabinetMat = new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.7 });
            const cabinet = new THREE.Mesh(cabinetGeo, cabinetMat);
            group.add(cabinet);

            const screenPlaneGeo = new THREE.PlaneGeometry(1.0, 0.8);
            const screenMat = new THREE.MeshBasicMaterial({ map: crtTexture });
            const screen = new THREE.Mesh(screenPlaneGeo, screenMat);
            screen.position.set(0, 0, 0.61);
            group.add(screen);

            scene.add(group);
            tvMesh = group;
        }

        // --- Animation Sequences ---
        function startBootSequence() {
            config.text = messageInput.value;
            config.size = parseInt(textSizeRange.value);
            config.speed = parseInt(scrollSpeedRange.value);
            config.fontFamily = fontSelect.value;
            config.textColor = document.querySelector('input[name="textColor"]:checked').value;

            tvState = 'noise';
            noiseIntensity = 1.0;
            textX = textCanvas.width;

            setTimeout(() => {
                if (tvState === 'noise') {
                    tvState = 'booting';
                    noiseIntensity = 0.4;
                    setTimeout(() => {
                        if (tvState === 'booting') {
                            tvState = 'running';
                            noiseIntensity = 0.05;
                        }
                    }, 600);
                }
            }, 1200);
        }

        function startPowerOffSequence() {
            if (tvState === 'off' || tvState === 'powering_off') return;
            tvState = 'powering_off';
            powerOffProgress = 0;

            const startTime = performance.now();
            const duration = 1000;

            function animatePowerOff(now) {
                const elapsed = now - startTime;
                powerOffProgress = Math.min(1.0, elapsed / duration);

                if (powerOffProgress < 1.0) {
                    requestAnimationFrame(animatePowerOff);
                } else {
                    tvState = 'off';
                }
            }
            requestAnimationFrame(animatePowerOff);
        }

        confirmBtn.addEventListener('click', startBootSequence);
        powerOffBtn.addEventListener('click', startPowerOffSequence);

        startBootSequence();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateCRTTexture();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
