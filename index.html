<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Retro TV 3D Interactive Touch Drag Calibration</title>
    <!-- Google Chinese Font: Noto Sans TC & DotGothic16 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
    
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(18, 22, 33, 0.95);
            --panel-border: rgba(255, 255, 255, 0.15);
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #webgl-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
        }

        @media (max-width: 850px) {
            .ui-layer {
                left: 16px;
                top: 16px;
                right: 16px;
                max-width: none;
            }
        }

        .interactive {
            pointer-events: auto;
        }

        .toggle-panel-btn {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .config-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .config-panel.collapsed {
            opacity: 0;
            transform: translateY(-10px);
            max-height: 0;
            padding: 0 24px;
            overflow: hidden;
            border: none;
            margin: 0;
        }

        .config-panel h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }

        input[type="text"] {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            text-align: center;
        }

        .action-btn.off {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
        }

        .action-btn.success {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .calibration-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .calib-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .calib-btn {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            text-align: center;
        }

        #crtTextureCanvas {
            display: none;
        }

        .hud-instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem;
            color: var(--text-dim);
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <canvas id="crtTextureCanvas" width="1024" height="768"></canvas>

    <div class="ui-layer">
        <button class="toggle-panel-btn interactive" id="togglePanelBtn">
            <span>⚙️ 觸控拖曳定位面板</span>
            <span id="toggleIcon">▲ 隱藏</span>
        </button>

        <div class="config-panel interactive" id="configPanel">
            <h2>電視設定</h2>
            
            <div class="control-group">
                <label for="messageInput">顯示文字</label>
                <input type="text" id="messageInput" value="正在顯示：復古電視 3D 模型">
            </div>

            <div class="control-group">
                <label for="textSizeRange">文字大小</label>
                <input type="range" id="textSizeRange" min="1" max="3" value="2" step="1">
            </div>

            <div class="control-group">
                <label for="scrollSpeedRange">捲動速度</label>
                <input type="range" id="scrollSpeedRange" min="0" max="3" value="2" step="1">
            </div>

            <div class="control-group">
                <label for="fontSelect">中文字型</label>
                <select id="fontSelect">
                    <option value="Noto Sans TC" selected>思源黑體</option>
                    <option value="DotGothic16">像素點陣體</option>
                    <option value="monospace">等寬字體</option>
                </select>
            </div>

            <div class="btn-row">
                <button class="action-btn" id="confirmBtn">確認開機/重整</button>
                <button class="action-btn off" id="powerOffBtn">關機效果</button>
            </div>

            <!-- Calibration Section -->
            <div class="calibration-box">
                <h3 style="color: #60a5fa; font-size: 0.9rem;">🎯 觸控拖曳定位工具</h3>
                <div id="calibStep1Container">
                    <button class="action-btn success" id="startCalibBtn">📍 開始觸控拖曳定位</button>
                </div>
                <div id="calibStep2Container" style="display: none;">
                    <p id="calibInstruction" style="font-size: 0.82rem; color: #cbd5e1;"></p>
                    <div style="font-size: 0.78rem; color: #93c5fd; margin: 4px 0;" id="currentPosDisplay">請用手指直接拖曳紅點</div>
                    <div class="calib-controls">
                        <button class="calib-btn" onclick="adjustPos('x', -0.01)">X -</button>
                        <button class="calib-btn" onclick="adjustPos('y', 0.01)">Y +</button>
                        <button class="calib-btn" onclick="adjustPos('x', 0.01)">X +</button>
                        <button class="calib-btn" onclick="adjustPos('y', -0.01)">Y -</button>
                        <button class="calib-btn" onclick="adjustPos('z', 0.01)">Z +</button>
                        <button class="calib-btn" onclick="adjustPos('z', -0.01)">Z -</button>
                    </div>
                    <button class="action-btn" id="nextPointBtn" style="margin-top: 8px;">確定此點位置</button>
                </div>
                <div id="calibResultContainer" style="display: none;">
                    <p style="font-size: 0.82rem; color: #34d399;">✅ 雙點定位完成！複製下方數值貼給 AI：</p>
                    <input type="text" id="resultOutput" readonly style="font-size: 0.8rem; margin-top: 4px;">
                    <button class="action-btn success" id="copyResultBtn" style="margin-top: 8px;">📋 複製定位數值</button>
                </div>
            </div>
        </div>
    </div>

    <div class="hud-instructions">
        💡 提示：開啟定位後，可直接用手指按住紅點拖曳移動位置。
    </div>

    <script>
        const togglePanelBtn = document.getElementById('togglePanelBtn');
        const configPanel = document.getElementById('configPanel');
        const toggleIcon = document.getElementById('toggleIcon');
        let isPanelOpen = true;

        togglePanelBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isPanelOpen = !isPanelOpen;
            if (isPanelOpen) {
                configPanel.classList.remove('collapsed');
                toggleIcon.textContent = '▲ 隱藏';
            } else {
                configPanel.classList.add('collapsed');
                toggleIcon.textContent = '▼ 展開';
            }
        });

        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const textCanvas = document.getElementById('crtTextureCanvas');
        const ctx = textCanvas.getContext('2d');
        const crtTexture = new THREE.CanvasTexture(textCanvas);

        let tvState = 'noise';
        let textX = textCanvas.width;
        let noiseIntensity = 1.0;

        function updateCRTTexture() {
            const w = textCanvas.width;
            const h = textCanvas.height;
            ctx.clearRect(0, 0, w, h);

            if (tvState === 'off') {
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, w, h);
                crtTexture.needsUpdate = true;
                return;
            }

            ctx.fillStyle = '#111827';
            ctx.fillRect(0, 0, w, h);

            if (tvState === 'noise' || tvState === 'booting' || noiseIntensity > 0.05) {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                const intensity = (tvState === 'noise') ? 220 : (noiseIntensity * 100);
                for (let i = 0; i < data.length; i += 4) {
                    if (Math.random() < 0.4) {
                        const val = Math.random() * intensity;
                        data[i] = Math.min(255, data[i] + val);
                        data[i+1] = Math.min(255, data[i+1] + val);
                        data[i+2] = Math.min(255, data[i+2] + val);
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            }

            if (tvState === 'running' || tvState === 'booting') {
                ctx.font = `bold 48px 'Noto Sans TC', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#cbd5e1';
                ctx.fillText(document.getElementById('messageInput').value, w / 2, h / 2);
            }

            crtTexture.needsUpdate = true;
        }

        let tvMesh = null;
        let screenMesh = null;
        let calibrationHelper = null;
        let calibStep = 0;
        let p1 = new THREE.Vector3();
        let p2 = new THREE.Vector3();
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let isDragging = false;
        let dragPlane = new THREE.Plane();

        const loader = new THREE.GLTFLoader();
        loader.load('tv__old_tv__retro_tv.glb', function (gltf) {
            tvMesh = gltf.scene;
            const box = new THREE.Box3().setFromObject(tvMesh);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            tvMesh.position.sub(center);
            tvMesh.scale.multiplyScalar(1.8 / Math.max(size.x, size.y, size.z));
            scene.add(tvMesh);

            const screenGeo = new THREE.PlaneGeometry(0.8, 0.6);
            const screenMat = new THREE.MeshBasicMaterial({ map: crtTexture, side: THREE.DoubleSide });
            screenMesh = new THREE.Mesh(screenGeo, screenMat);
            screenMesh.position.set(0, 0.15, 0.45);
            tvMesh.add(screenMesh);
        });

        // 防止面板上的點擊穿透到畫布去旋轉相機
        configPanel.addEventListener('pointerdown', (e) => e.stopPropagation());
        configPanel.addEventListener('touchstart', (e) => e.stopPropagation());

        // 觸控拖曳紅點邏輯
        window.addEventListener('pointerdown', (event) => {
            if (calibStep === 0 || !calibrationHelper) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(calibrationHelper, true);

            if (intersects.length > 0) {
                isDragging = true;
                controls.enabled = false;

                dragPlane.setFromNormalAndCoplanarPoint(
                    camera.getWorldDirection(new THREE.Vector3()).negate(),
                    calibrationHelper.position
                );
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (!isDragging || !calibrationHelper) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            let targetPos = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(dragPlane, targetPos)) {
                calibrationHelper.position.copy(targetPos);
                updatePosDisplay();
            }
        });

        window.addEventListener('pointerup', () => {
            if (isDragging) {
                isDragging = false;
                controls.enabled = true;
            }
        });

        const startCalibBtn = document.getElementById('startCalibBtn');
        const calibStep1Container = document.getElementById('calibStep1Container');
        const calibStep2Container = document.getElementById('calibStep2Container');
        const calibResultContainer = document.getElementById('calibResultContainer');
        const calibInstruction = document.getElementById('calibInstruction');
        const currentPosDisplay = document.getElementById('currentPosDisplay');
        const nextPointBtn = document.getElementById('nextPointBtn');
        const resultOutput = document.getElementById('resultOutput');
        const copyResultBtn = document.getElementById('copyResultBtn');

        // 使用 pointerdown 確保手機點擊按鈕能立即反應
        startCalibBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            calibStep = 1;
            calibStep1Container.style.display = 'none';
            calibStep2Container.style.display = 'block';
            calibInstruction.textContent = '步驟 1/2：請用手指【按住紅色球體】直接拖曳至螢幕左下角';
            
            const group = new THREE.Group();
            const sphereGeo = new THREE.SphereGeometry(0.08, 32, 32);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            group.add(sphere);

            calibrationHelper = group;
            scene.add(calibrationHelper);
            calibrationHelper.position.set(0, 0.15, 0.5);
            updatePosDisplay();
        });

        window.adjustPos = function(axis, delta) {
            if (!calibrationHelper) return;
            calibrationHelper.position[axis] += delta;
            updatePosDisplay();
        };

        function updatePosDisplay() {
            if (!calibrationHelper) return;
            const p = calibrationHelper.position;
            currentPosDisplay.textContent = `紅點世界座標: X=${p.x.toFixed(3)}, Y=${p.y.toFixed(3)}, Z=${p.z.toFixed(3)}`;
        }

        nextPointBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (calibStep === 1) {
                p1.copy(calibrationHelper.position);
                calibStep = 2;
                calibInstruction.textContent = '步驟 2/2：請用手指【按住紅色球體】直接拖曳至螢幕右上角';
                calibrationHelper.position.set(0.2, 0.3, 0.5);
                updatePosDisplay();
            } else if (calibStep === 2) {
                p2.copy(calibrationHelper.position);
                scene.remove(calibrationHelper);
                
                const localP1 = tvMesh.worldToLocal(p1.clone());
                const localP2 = tvMesh.worldToLocal(p2.clone());

                const center = new THREE.Vector3().addVectors(localP1, localP2).multiplyScalar(0.5);
                const width = Math.abs(localP2.x - localP1.x);
                const height = Math.abs(localP2.y - localP1.y);

                screenMesh.geometry.dispose();
                screenMesh.geometry = new THREE.PlaneGeometry(width, height);
                screenMesh.position.copy(center);

                calibStep2Container.style.display = 'none';
                calibResultContainer.style.display = 'block';
                const resultStr = `screenMesh.geometry = new THREE.PlaneGeometry(${width.toFixed(3)}, ${height.toFixed(3)});\nscreenMesh.position.set(${center.x.toFixed(3)}, ${center.y.toFixed(3)}, ${center.z.toFixed(3)});`;
                resultOutput.value = resultStr;
            }
        });

        copyResultBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            resultOutput.select();
            navigator.clipboard.writeText(resultOutput.value);
            copyResultBtn.textContent = '✅ 已複製！';
            setTimeout(() => copyResultBtn.textContent = '📋 複製定位數值', 2000);
        });

        document.getElementById('confirmBtn').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            tvState = 'running';
        });

        document.getElementById('powerOffBtn').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            tvState = 'off';
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateCRTTexture();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
