<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retro TV 3D TransformControls Screen Calibration</title>
    <!-- Google Chinese Font: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Three.js, OrbitControls, TransformControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(18, 22, 33, 0.95);
            --panel-border: rgba(255, 255, 255, 0.15);
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #webgl-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            color: var(--text-main);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 320px;
            overflow: hidden;
            transition: max-height 0.25s ease-out;
            max-height: 90vh;
        }

        .ui-panel.collapsed {
            max-height: 52px;
        }

        .panel-header {
            background: rgba(30, 35, 45, 0.9);
            padding: 12px 16px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            height: 52px;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #60a5fa;
        }

        .toggle-collapse-btn {
            background: #374151;
            color: #fff;
            border: none;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .panel-content {
            padding: 16px;
            max-height: calc(90vh - 52px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-dim);
        }

        input[type="text"] {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            text-align: center;
        }

        .action-btn.off {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
        }

        .action-btn.success {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .action-btn.warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .calibration-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mode-btn-pair {
            display: flex;
            gap: 6px;
        }

        .mode-sub-btn {
            flex: 1;
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.2);
            color: #ccc;
            padding: 8px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }

        .mode-sub-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }

        #crtTextureCanvas {
            display: none;
        }

        .hud-instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 0.85rem;
            color: #60a5fa;
            pointer-events: none;
            z-index: 100;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <canvas id="crtTextureCanvas" width="1024" height="768"></canvas>

    <div class="ui-panel" id="movable-panel">
        <div class="panel-header" id="panel-drag-handle">
            <span class="panel-title">📺 3D 電視螢幕精密定位</span>
            <button class="toggle-collapse-btn" id="btn-collapse">收合 [-]</button>
        </div>
        
        <div class="panel-content">
            <div class="control-group">
                <label for="messageInput">電視顯示文字</label>
                <input type="text" id="messageInput" value="正在顯示：復古電視 3D 模型">
            </div>

            <div class="btn-row">
                <button class="action-btn" id="confirmBtn">開機預覽</button>
                <button class="action-btn off" id="powerOffBtn">關機效果</button>
            </div>

            <!-- Calibration Section using TransformControls -->
            <div class="calibration-box">
                <h3 style="color: #60a5fa; font-size: 0.88rem; margin-bottom: 4px;">🎛️ 螢幕 3D 調整工具箱</h3>
                <p style="font-size: 0.78rem; color: #94a3b8; line-height: 1.4;">
                    點擊下方按鈕啟動控制框，直接用 3D 箭頭移動、旋轉或縮放螢幕至完美貼合！
                </p>
                
                <div style="display: flex; gap: 8px; margin-top: 4px;">
                    <button class="action-btn success" id="toggleCalibBtn" style="flex: 1; padding: 10px; font-size: 0.85rem;">🔧 開啟螢幕調整框</button>
                </div>

                <div id="transformModeBox" style="display: none; margin-top: 6px;" class="control-group">
                    <label>操作模式：</label>
                    <div class="mode-btn-pair">
                        <button id="btn-mode-translate" class="mode-sub-btn active" onclick="setTransformMode('translate')">平移 (位置)</button>
                        <button id="btn-mode-rotate" class="mode-sub-btn" onclick="setTransformMode('rotate')">旋轉 (角度)</button>
                        <button id="btn-mode-scale" class="mode-sub-btn" onclick="setTransformMode('scale')">縮放 (大小)</button>
                    </div>
                </div>

                <div id="calibResultContainer" style="display: none; margin-top: 4px;">
                    <label style="font-size: 0.78rem; color: #34d399;">✅ 當前螢幕數值 (可複製)：</label>
                    <input type="text" id="resultOutput" readonly style="font-size: 0.78rem; margin-top: 4px;">
                    <button class="action-btn warning" id="copyResultBtn" style="width: 100%; margin-top: 6px; padding: 8px; font-size: 0.8rem;">📋 複製數值</button>
                </div>
            </div>
        </div>
    </div>

    <div class="hud-instructions" id="hudInstruction">
        💡 提示：點擊上方控制面板的「開啟螢幕調整框」即可直接在 3D 視角中拖曳調整螢幕。
    </div>

    <script>
        const collapseBtn = document.getElementById('btn-collapse');
        const panel = document.getElementById('movable-panel');
        collapseBtn.addEventListener('click', () => {
            panel.classList.toggle('collapsed');
            collapseBtn.innerText = panel.classList.contains('collapsed') ? "展開 [+]" : "收合 [-]";
        });

        // Panel draggable handling
        const handle = document.getElementById('panel-drag-handle');
        let isDraggingPanel = false, startX, startY, initialLeft, initialTop;
        handle.addEventListener('mousedown', dragStart);
        handle.addEventListener('touchstart', dragStart, { passive: false });

        function dragStart(e) {
            if (e.target === collapseBtn) return;
            isDraggingPanel = true;
            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            startX = clientX; startY = clientY;
            const rect = panel.getBoundingClientRect();
            initialLeft = rect.left; initialTop = rect.top;
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('touchend', dragEnd);
        }
        function dragMove(e) {
            if (!isDraggingPanel) return;
            if (e.cancelable) e.preventDefault();
            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            panel.style.left = Math.max(0, Math.min(initialLeft + (clientX - startX), window.innerWidth - panel.offsetWidth)) + 'px';
            panel.style.top = Math.max(0, Math.min(initialTop + (clientY - startY), window.innerHeight - panel.offsetHeight)) + 'px';
        }
        function dragEnd() {
            isDraggingPanel = false;
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('touchend', dragEnd);
        }

        // Three.js setup
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const textCanvas = document.getElementById('crtTextureCanvas');
        const ctx = textCanvas.getContext('2d');
        const crtTexture = new THREE.CanvasTexture(textCanvas);

        let tvState = 'noise';

        function updateCRTTexture() {
            const w = textCanvas.width;
            const h = textCanvas.height;
            ctx.clearRect(0, 0, w, h);

            if (tvState === 'off') {
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, w, h);
                crtTexture.needsUpdate = true;
                return;
            }

            ctx.fillStyle = '#111827';
            ctx.fillRect(0, 0, w, h);

            if (tvState === 'noise' || tvState === 'booting') {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                const intensity = (tvState === 'noise') ? 220 : 100;
                for (let i = 0; i < data.length; i += 4) {
                    if (Math.random() < 0.4) {
                        const val = Math.random() * intensity;
                        data[i] = Math.min(255, data[i] + val);
                        data[i+1] = Math.min(255, data[i+1] + val);
                        data[i+2] = Math.min(255, data[i+2] + val);
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            }

            if (tvState === 'running' || tvState === 'booting') {
                ctx.font = `bold 48px 'Noto Sans TC', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#cbd5e1';
                ctx.fillText(document.getElementById('messageInput').value, w / 2, h / 2);
            }

            crtTexture.needsUpdate = true;
        }

        let tvMesh = null;
        let screenMesh = null;
        let transformControls = null;
        let isCalibrating = false;

        const loader = new THREE.GLTFLoader();
        loader.load('tv__old_tv__retro_tv.glb', function (gltf) {
            tvMesh = gltf.scene;
            const box = new THREE.Box3().setFromObject(tvMesh);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            tvMesh.position.sub(center);
            tvMesh.scale.multiplyScalar(1.8 / Math.max(size.x, size.y, size.z));
            scene.add(tvMesh);

            // 套用您最新輸入的定位與縮放數值
            const screenGeo = new THREE.PlaneGeometry(0.78, 0.58);
            const screenMat = new THREE.MeshBasicMaterial({ map: crtTexture, side: THREE.DoubleSide });
            screenMesh = new THREE.Mesh(screenGeo, screenMat);
            screenMesh.position.set(0.910, -0.247, -0.018);
            screenMesh.scale.set(1.904, 2.303, 488901.797);
            tvMesh.add(screenMesh);
        });

        // TransformControls Setup
        transformControls = new THREE.TransformControls(camera, renderer.domElement);
        transformControls.size = 0.8;
        scene.add(transformControls);

        transformControls.addEventListener('dragging-changed', (event) => {
            controls.enabled = !event.value;
        });

        transformControls.addEventListener('change', () => {
            if (screenMesh && isCalibrating) {
                updateResultOutput();
            }
        });

        window.setTransformMode = function(mode) {
            transformControls.setMode(mode);
            ['translate', 'rotate', 'scale'].forEach(m => {
                document.getElementById(`btn-mode-${m}`).classList.toggle('active', m === mode);
            });
        };

        const toggleCalibBtn = document.getElementById('toggleCalibBtn');
        const transformModeBox = document.getElementById('transformModeBox');
        const calibResultContainer = document.getElementById('calibResultContainer');
        const hudInstruction = document.getElementById('hudInstruction');

        toggleCalibBtn.addEventListener('click', () => {
            isCalibrating = !isCalibrating;
            if (isCalibrating) {
                if (screenMesh) {
                    scene.attach(screenMesh);
                    transformControls.attach(screenMesh);
                }
                toggleCalibBtn.textContent = '🔒 完成並鎖定螢幕';
                toggleCalibBtn.className = 'action-btn off';
                transformModeBox.style.display = 'block';
                calibResultContainer.style.display = 'block';
                hudInstruction.textContent = '✨ 已解鎖螢幕 3D 調整框！請使用控制軸直接調整螢幕';
                updateResultOutput();
            } else {
                transformControls.detach();
                if (tvMesh && screenMesh) {
                    tvMesh.attach(screenMesh);
                }
                toggleCalibBtn.textContent = '🔧 開啟螢幕調整框';
                toggleCalibBtn.className = 'action-btn success';
                transformModeBox.style.display = 'none';
                hudInstruction.textContent = '💡 提示：點擊上方控制面板的「開啟螢幕調整框」即可調整螢幕。';
            }
        });

        function updateResultOutput() {
            if (!screenMesh) return;
            const p = screenMesh.position;
            const s = screenMesh.scale;
            const str = `screenMesh.position.set(${p.x.toFixed(3)}, ${p.y.toFixed(3)}, ${p.z.toFixed(3)});\nscreenMesh.scale.set(${s.x.toFixed(3)}, ${s.y.toFixed(3)}, ${s.z.toFixed(3)});`;
            document.getElementById('resultOutput').value = str;
        }

        document.getElementById('copyResultBtn').addEventListener('click', () => {
            const out = document.getElementById('resultOutput');
            out.select();
            navigator.clipboard.writeText(out.value);
            document.getElementById('copyResultBtn').textContent = '✅ 已複製數值！';
            setTimeout(() => { document.getElementById('copyResultBtn').textContent = '📋 複製數值'; }, 2000);
        });

        document.getElementById('confirmBtn').addEventListener('click', () => { tvState = 'running'; });
        document.getElementById('powerOffBtn').addEventListener('click', () => { tvState = 'off'; });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateCRTTexture();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
